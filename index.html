<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Millaira Studio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f5f0;
            color: #1a1a1a;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 6%;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        nav a {
            margin-left: 25px;
            text-decoration: none;
            color: #1a1a1a;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        .hero-content {
            max-width: 800px;
        }

      .hero h1 {
            font-size: clamp(48px, 8vw, 100px);
            line-height: 0.95;
            margin-bottom: 25px;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 16px 30px;
            background: #1a1a1a;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .section {
            padding: 100px 6%;
            text-align: center;
        }

        .section h2 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        footer {
            padding: 40px 6%;
            text-align: center;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">MILLAIRA STUDIO</div>

    <nav>
        <a href="#">Shop</a>
        <a href="#">Work</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>

    <section class="hero">

        <div class="hero-content">

            <h1>
                HANDMADE
                CHARACTERS
            </h1>

            <p>
                Custom handmade figures created
                from your character and imagination.
            </p>

            <a href="#" class="button">
                SHOP HANDMADE
            </a>

        </div>

    </section>

    <section class="section">

        <h2>
            Made For You.
        </h2>

        <p>
            Millaira Studio creates handmade
            character collectibles and creative artwork.
        </p>

    </section>

</main>

<footer>
    © 2026 Millaira Studio
</footer>

</body>
</html>
